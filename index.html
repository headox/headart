<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Battle Zone 3D</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #101820; font-family: Arial, sans-serif; touch-action: none; }
  canvas { display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: white; text-shadow: 0 2px 3px #000; }
  .panel { background: rgba(0,0,0,.48); border: 1px solid rgba(255,255,255,.2); border-radius: 10px; padding: 8px 11px; }
  #top { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
  #healthWrap { width: 140px; height: 9px; background: #4b2020; border-radius: 8px; overflow: hidden; margin-top: 5px; }
  #health { height: 100%; width: 100%; background: #46df70; transition: width .15s; }
  #message { position: absolute; left: 50%; top: 44%; transform: translate(-50%,-50%); text-align: center; font-size: clamp(22px, 5vw, 38px); font-weight: bold; display: none; width: 90%; }
  #help { position: absolute; top: 74px; left: 10px; font-size: 12px; max-width: 190px; line-height: 1.35; }
  #controls { position: fixed; inset: 0; pointer-events: none; }
  #stickBase { position: absolute; left: 22px; bottom: 26px; width: 118px; height: 118px; border-radius: 50%; background: rgba(255,255,255,.13); border: 2px solid rgba(255,255,255,.35); pointer-events: auto; touch-action: none; }
  #stick { position: absolute; left: 34px; top: 34px; width: 46px; height: 46px; border-radius: 50%; background: rgba(255,255,255,.6); border: 2px solid white; }
  .action { position: absolute; right: 22px; border: 2px solid rgba(255,255,255,.65); border-radius: 50%; color: white; font-weight: bold; background: rgba(25,40,55,.72); pointer-events: auto; touch-action: none; }
  #shoot { width: 78px; height: 78px; bottom: 38px; font-size: 15px; }
  #jump { width: 58px; height: 58px; bottom: 128px; right: 33px; font-size: 12px; }
  #restart { position: absolute; left: 50%; top: calc(44% + 55px); transform: translateX(-50%); pointer-events: auto; display: none; border: 0; border-radius: 10px; padding: 12px 20px; font-size: 16px; font-weight: bold; background: #f2c14e; color: #111; }
  #crosshair { position: absolute; left: 50%; top: 50%; width: 18px; height: 18px; transform: translate(-50%,-50%); opacity: .8; }
  #crosshair:before, #crosshair:after { content: ""; position: absolute; background: white; }
  #crosshair:before { left: 8px; top: 0; width: 2px; height: 18px; }
  #crosshair:after { left: 0; top: 8px; width: 18px; height: 2px; }
  @media (min-width: 800px) { #help { max-width: 240px; font-size: 14px; } }
</style>
</head>
<body>
<div id="hud">
  <div id="top">
    <div class="panel"><strong>⚔ BATTLE ZONE 3D</strong><div style="font-size:12px;margin-top:4px">Health</div><div id="healthWrap"><div id="health"></div></div></div>
    <div class="panel" id="stats">Enemies: 5<br>Eliminations: 0</div>
  </div>
  <div id="help" class="panel">Move: left joystick / WASD<br>Aim: move mouse or tap screen<br>Fire: FIRE button / click<br>Defeat all bots and stay in the safe zone.</div>
  <div id="crosshair"></div>
  <div id="message"></div>
  <button id="restart">PLAY AGAIN</button>
</div>
<div id="controls">
  <div id="stickBase"><div id="stick"></div></div>
  <button id="jump" class="action">JUMP</button>
  <button id="shoot" class="action">FIRE</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(() => {
  const message = document.getElementById('message');
  const restartBtn = document.getElementById('restart');
  const healthBar = document.getElementById('health');
  const stats = document.getElementById('stats');
  const stickBase = document.getElementById('stickBase');
  const stick = document.getElementById('stick');
  const shootBtn = document.getElementById('shoot');
  const jumpBtn = document.getElementById('jump');

  if (!window.THREE) {
    message.style.display = 'block';
    message.textContent = 'Could not load 3D library. Check your internet connection and reload.';
    return;
  }

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87b9d8);
  scene.fog = new THREE.Fog(0x87b9d8, 38, 105);

  const camera = new THREE.PerspectiveCamera(68, innerWidth / innerHeight, 0.1, 250);
  const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.6));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.insertBefore(renderer.domElement, document.getElementById('hud'));

  scene.add(new THREE.HemisphereLight(0xd9efff, 0x566044, 2.0));
  const sun = new THREE.DirectionalLight(0xffffff, 2.1);
  sun.position.set(-18, 30, 18);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  sun.shadow.camera.left = -40; sun.shadow.camera.right = 40;
  sun.shadow.camera.top = 40; sun.shadow.camera.bottom = -40;
  scene.add(sun);

  const mat = (color, roughness=0.9) => new THREE.MeshStandardMaterial({ color, roughness });
  const groundMat = mat(0x647b43);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(180, 180), groundMat);
  ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);

  // Safe-zone ring
  const ring = new THREE.Mesh(new THREE.TorusGeometry(23, 0.16, 8, 120), new THREE.MeshBasicMaterial({ color: 0x42f5a1 }));
  ring.rotation.x = Math.PI/2; ring.position.y = 0.12; scene.add(ring);
  const zoneDisc = new THREE.Mesh(new THREE.CircleGeometry(23, 80), new THREE.MeshBasicMaterial({ color: 0x36d995, transparent: true, opacity: 0.055, side: THREE.DoubleSide }));
  zoneDisc.rotation.x = -Math.PI/2; zoneDisc.position.y = 0.025; scene.add(zoneDisc);

  const obstacles = [];
  function building(x,z,w,h,d,color) {
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat(color));
    mesh.position.set(x,h/2,z); mesh.castShadow = true; mesh.receiveShadow = true; scene.add(mesh);
    const roof = new THREE.Mesh(new THREE.BoxGeometry(w+0.3,0.25,d+0.3), mat(0x424b50));
    roof.position.set(x,h+0.1,z); roof.castShadow = true; scene.add(roof);
    obstacles.push({x,z,rx:w/2+0.8,rz:d/2+0.8});
    // simple windows
    const winMat = new THREE.MeshStandardMaterial({color:0x9bd5e8, emissive:0x162d36, roughness:0.3});
    for (let side of [-1,1]) {
      for (let yy=1.2; yy<h-0.2; yy+=1.35) {
        const win = new THREE.Mesh(new THREE.BoxGeometry(0.65,0.55,0.06), winMat);
        win.position.set(x + side*(w/2+0.035), yy, z); scene.add(win);
      }
    }
  }
  building(-10,-8,7,4,6,0xc7b99d);
  building(12,-13,8,5,6,0xb5a88e);
  building(-17,12,6,3.4,8,0xb9c0b6);
  building(16,12,7,4,7,0xcbb99b);
  building(0,-25,10,4.5,5,0x9daeb4);

  // Trees
  for (let i=0;i<34;i++) {
    const a = Math.random()*Math.PI*2, r = 27+Math.random()*34;
    const x = Math.cos(a)*r, z = Math.sin(a)*r;
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.34,2.2,7), mat(0x6a4b2c));
    trunk.position.set(x,1.1,z); trunk.castShadow = true; scene.add(trunk);
    const leaves = new THREE.Mesh(new THREE.ConeGeometry(1.5+Math.random(),3.3,7), mat(0x2e6e3e));
    leaves.position.set(x,3.2,z); leaves.castShadow = true; scene.add(leaves);
    obstacles.push({x,z,rx:0.7,rz:0.7});
  }

  // Decorative rocks
  for(let i=0;i<25;i++){
    const x=(Math.random()-.5)*100, z=(Math.random()-.5)*100;
    if(Math.hypot(x,z)<27) continue;
    const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(0.5+Math.random()*0.8,0),mat(0x77796d));
    rock.position.set(x,0.35,z); rock.scale.y=.7; rock.castShadow=true; scene.add(rock);
  }

  function makeCharacter(color, isPlayer=false) {
    const g = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(0.8,1.05,0.45), mat(color));
    body.position.y=1.25; body.castShadow=true; g.add(body);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.32,12,10), mat(0xe0b28a));
    head.position.y=2.05; head.castShadow=true; g.add(head);
    const helmet = new THREE.Mesh(new THREE.SphereGeometry(0.35,12,8,0,Math.PI*2,0,Math.PI/2),mat(isPlayer?0x263e5c:0x34383c));
    helmet.position.y=2.17; g.add(helmet);
    const legMat=mat(0x303a43);
    for(const side of [-1,1]){
      const leg=new THREE.Mesh(new THREE.BoxGeometry(.25,.75,.28),legMat);
      leg.position.set(side*.22,.42,0); leg.castShadow=true; g.add(leg);
      const arm=new THREE.Mesh(new THREE.BoxGeometry(.22,.75,.25),mat(color));
      arm.position.set(side*.52,1.38,0); arm.rotation.z=side*-.12; g.add(arm);
    }
    const gun=new THREE.Mesh(new THREE.BoxGeometry(.18,.18,.85),mat(0x20252a));
    gun.position.set(.35,1.48,-.55); gun.castShadow=true; g.add(gun);
    return g;
  }

  const player = { group: makeCharacter(0x2879df,true), x:0, z:8, y:0, health:100, eliminations:0, speed:7.5, vy:0, grounded:true, alive:true };
  player.group.position.set(player.x,0,player.z); scene.add(player.group);

  const bots=[];
  const botColors=[0xd94b4b,0xd6a52f,0x9b62d8,0xe36b36,0x43a9a0,0xc44d83];
  for(let i=0;i<5;i++){
    let a=(i/5)*Math.PI*2, r=13+Math.random()*6;
    const b={group:makeCharacter(botColors[i]),x:Math.cos(a)*r,z:Math.sin(a)*r,health:100,alive:true,shotTimer:1+Math.random()*2,moveTimer:0};
    b.group.position.set(b.x,0,b.z); scene.add(b.group); bots.push(b);
  }

  const bullets=[];
  function addBullet(origin, direction, owner) {
    const bullet = new THREE.Mesh(new THREE.SphereGeometry(0.11,8,6), mat(owner==='player'?0xffe16b:0xff6b6b));
    bullet.position.copy(origin); scene.add(bullet);
    bullets.push({mesh:bullet,dir:direction.clone().normalize(),owner,life:1.6,damage:owner==='player'?50:9});
  }

  const keys={}; let moveX=0,moveY=0, shooting=false, yaw=0, pitch=0, gameOver=false;
  function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
  function collides(x,z){
    if(Math.abs(x)>78||Math.abs(z)>78) return true;
    for(const o of obstacles) if(Math.abs(x-o.x)<o.rx && Math.abs(z-o.z)<o.rz) return true;
    return false;
  }
  function moveEntity(entity,dx,dz){
    let nx=entity.x+dx, nz=entity.z+dz;
    if(!collides(nx,entity.z)) entity.x=nx;
    if(!collides(entity.x,nz)) entity.z=nz;
  }
  function aimDirection(){
    return new THREE.Vector3(Math.sin(yaw)*Math.cos(pitch), Math.sin(pitch), -Math.cos(yaw)*Math.cos(pitch)).normalize();
  }
  function shoot(){
    if(gameOver||!player.alive) return;
    const origin=new THREE.Vector3(player.x,1.55,player.z).add(aimDirection().multiplyScalar(0.9));
    addBullet(origin,aimDirection(), 'player');
  }
  function jump(){ if(player.grounded&&!gameOver){player.vy=7;player.grounded=false;} }
  shootBtn.addEventListener('pointerdown',e=>{e.preventDefault();shooting=true;shoot();});
  shootBtn.addEventListener('pointerup',()=>shooting=false);
  shootBtn.addEventListener('pointercancel',()=>shooting=false);
  jumpBtn.addEventListener('pointerdown',e=>{e.preventDefault();jump();});
  restartBtn.addEventListener('click',()=>location.reload());

  // Virtual joystick
  let stickPointer=null;
  function updateStick(e){
    const r=stickBase.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
    let dx=e.clientX-cx, dy=e.clientY-cy, max=38, len=Math.hypot(dx,dy);
    if(len>max){dx=dx/len*max;dy=dy/len*max;}
    stick.style.transform=`translate(${dx}px,${dy}px)`;
    moveX=dx/max; moveY=dy/max;
  }
  stickBase.addEventListener('pointerdown',e=>{e.preventDefault();stickPointer=e.pointerId;stickBase.setPointerCapture(e.pointerId);updateStick(e);});
  stickBase.addEventListener('pointermove',e=>{if(e.pointerId===stickPointer)updateStick(e);});
  function resetStick(){stickPointer=null;moveX=moveY=0;stick.style.transform='translate(0,0)';}
  stickBase.addEventListener('pointerup',resetStick); stickBase.addEventListener('pointercancel',resetStick);

  // Mouse / right-side touch aiming
  let lookPointer=null, lastX=0,lastY=0;
  renderer.domElement.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse'){lookPointer=e.pointerId;lastX=e.clientX;lastY=e.clientY;}
    else if(e.clientX>innerWidth*.42 && e.clientY<innerHeight-155){lookPointer=e.pointerId;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId);}
  });
  renderer.domElement.addEventListener('pointermove',e=>{
    if(lookPointer===e.pointerId){
      const dx=e.clientX-lastX,dy=e.clientY-lastY;
      yaw-=dx*0.006; pitch=clamp(pitch-dy*0.004,-0.55,0.42);
      lastX=e.clientX;lastY=e.clientY;
    }
  });
  renderer.domElement.addEventListener('pointerup',e=>{if(lookPointer===e.pointerId)lookPointer=null;});
  renderer.domElement.addEventListener('pointercancel',()=>lookPointer=null);
  addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space')jump();if(e.key===' ')e.preventDefault();});
  addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
  addEventListener('mousedown',e=>{if(e.button===0 && innerWidth>700)shooting=true;});
  addEventListener('mouseup',()=>shooting=false);

  let lastShot=0, lastBotShot=0, previous=performance.now();
  function finish(won){
    if(gameOver)return; gameOver=true;
    message.style.display='block';
    message.innerHTML=won?'🏆 VICTORY!<div style="font-size:16px;margin-top:8px">All enemy bots defeated.</div>':'GAME OVER<div style="font-size:16px;margin-top:8px">Try again and stay in the safe zone.</div>';
    restartBtn.style.display='block';
  }
  function animate(now){
    requestAnimationFrame(animate);
    const dt=Math.min((now-previous)/1000,.04); previous=now;
    if(!gameOver){
      // Player movement relative to facing direction
      let ix=moveX, iz=moveY;
      if(keys['a']||keys['arrowleft'])ix-=1;
      if(keys['d']||keys['arrowright'])ix+=1;
      if(keys['w']||keys['arrowup'])iz-=1;
      if(keys['s']||keys['arrowdown'])iz+=1;
      const il=Math.hypot(ix,iz); if(il>1){ix/=il;iz/=il;}
      const forwardX=Math.sin(yaw), forwardZ=-Math.cos(yaw);
      const rightX=Math.cos(yaw), rightZ=Math.sin(yaw);
      const dx=(rightX*ix+forwardX*(-iz))*player.speed*dt;
      const dz=(rightZ*ix+forwardZ*(-iz))*player.speed*dt;
      moveEntity(player,dx,dz);
      player.group.position.set(player.x,player.y,player.z);
      player.group.rotation.y=yaw;
      player.vy-=18*dt; player.y+=player.vy*dt;
      if(player.y<=0){player.y=0;player.vy=0;player.grounded=true;}
      player.group.position.y=player.y;
      if(shooting && now-lastShot>250){shoot();lastShot=now;}

      // Bots chase and occasionally fire
      for(const b of bots){
        if(!b.alive)continue;
        const dx=player.x-b.x,dz=player.z-b.z,dist=Math.hypot(dx,dz);
        if(dist>2.8){moveEntity(b,dx/(dist||1)*1.7*dt,dz/(dist||1)*1.7*dt);}
        b.group.position.set(b.x,0,b.z);
        b.group.rotation.y=Math.atan2(dx,-dz);
        b.shotTimer-=dt;
        if(dist<24 && b.shotTimer<=0 && player.alive){
          const from=new THREE.Vector3(b.x,1.5,b.z);
          const to=new THREE.Vector3(player.x,1.4+player.y,player.z);
          addBullet(from,to.sub(from),'bot'); b.shotTimer=1.2+Math.random()*1.2;
        }
      }

      // Bullets and hit checks
      for(let i=bullets.length-1;i>=0;i--){
        const bl=bullets[i]; bl.life-=dt; bl.mesh.position.addScaledVector(bl.dir,25*dt);
        let remove=bl.life<=0;
        if(!remove && bl.owner==='player'){
          for(const b of bots){if(!b.alive)continue;
            if(bl.mesh.position.distanceTo(new THREE.Vector3(b.x,1.3,b.z))<0.9){
              b.health-=bl.damage;remove=true;
              if(b.health<=0){b.alive=false;scene.remove(b.group);player.eliminations++;}
              break;
            }
          }
        } else if(!remove && bl.owner==='bot'){
          if(bl.mesh.position.distanceTo(new THREE.Vector3(player.x,1.4+player.y,player.z))<0.85){
            player.health-=bl.damage;remove=true;
          }
        }
        if(remove){scene.remove(bl.mesh);bullets.splice(i,1);}
      }

      // Safe-zone damage outside the ring
      if(Math.hypot(player.x,player.z)>23){player.health-=5*dt;}
      player.health=clamp(player.health,0,100);
      healthBar.style.width=player.health+'%';
      healthBar.style.background=player.health<30?'#ff4444':'#46df70';
      const alive=bots.filter(b=>b.alive).length;
      stats.innerHTML='Enemies: '+alive+'<br>Eliminations: '+player.eliminations;
      if(player.health<=0){player.alive=false;finish(false);}
      else if(alive===0)finish(true);
    }

    // Camera follows player from behind
    const target=new THREE.Vector3(player.x,1.35+player.y,player.z);
    const dir=aimDirection();
    const desired=target.clone().add(new THREE.Vector3(-dir.x*6,3.0-dir.y*2,-dir.z*6));
    camera.position.lerp(desired,0.12);
    camera.lookAt(target.clone().add(dir.clone().multiplyScalar(9)));
    ring.rotation.z+=0; // keep the safe-zone ring stable
    renderer.render(scene,camera);
  }
  addEventListener('resize',()=>{
    camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.6));
  });
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
